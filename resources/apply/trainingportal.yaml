apiVersion: training.educates.dev/v1beta1
kind: TrainingPortal
metadata:
  name: course-spring-academy-sample
spec:
  portal:
    title: Spring Academy / Sample Course
    registration:
      type: anonymous
    updates:
      workshop: true
    sessions:
      maximum: 180
    theme:
      frame:
        ancestors:
        - https://spring.academy
        - https://*.spring.academy
        - https://*.vmware.com
        - https://*.broadcom.com
        - https://spring-staging.academy
        - https://spring-academy.broadcom.com
        - https://spring-academy-verify.broadcom.com
        - https://spring-academy-qa.broadcom.net
        - https://spring-academy-dev.broadcom.net
        - http://localhost:8080
  analytics:
    google:
      trackingId: "${ANALYTICS_GOOGLE_ID}"
    clarity:
      trackingId: "${ANALYTICS_CLARITY_ID}"
  workshops:
    - name: spr-sample-first-lab
      expires: 60m
      orphaned: 5m
      reserved: ${TRAINING_PORTAL_RESERVED}
    - name: spr-sample-nth-lab
      expires: 60m
      orphaned: 5m
      reserved: ${TRAINING_PORTAL_RESERVED}
    - name: spr-sample-docker-in-docker
      expires: 60m
      orphaned: 5m
      reserved: ${TRAINING_PORTAL_RESERVED}
    - name: spr-sample-multi-terms
      expires: 60m
      orphaned: 5m
      reserved: ${TRAINING_PORTAL_RESERVED}
    - name: spr-sample-hugo
      expires: 60m
      orphaned: 5m
      reserved: ${TRAINING_PORTAL_RESERVED}
    - name: spr-sample-short-timeout
      expires: 3m
      deadline: 5m
      reserved: ${TRAINING_PORTAL_RESERVED}
    - name: spr-sample-spring-boot-docker-compose
      expires: 60m
      orphaned: 5m
      reserved: ${TRAINING_PORTAL_RESERVED}
